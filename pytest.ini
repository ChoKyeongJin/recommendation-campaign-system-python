[pytest]
# 설정 파일이 없으면 rootdir 이 실행 위치·인자에 따라 "추론"된다. rootdir 이 흔들리면 nodeid 도 흔들리고,
# nodeid 로 실패를 고정하는 tests/known_failures.json 대장이 통째로 무의미해진다. 이 파일의 첫 임무는
# rootdir 고정이다. 아울러 설정 로더 5종(metric_registry / segment_semantics / capability_registry 등)이
# 상대경로 기본값을 쓰므로, 레포 루트가 rootdir 이어야 레지스트리가 조용히 빈 채로 돌지 않는다.

# 인자 없이 pytest 만 쳐도 tests/ 만 수집한다(루트의 build_*.py, check_*.py 등을 긁지 않는다).
testpaths = tests

# 저장소 루트를 sys.path 에 넣는다 — graph_rag / ir_snapshot / regex_inventory 같은 루트 모듈용.
# tests/ 는 여기 적지 않는다: tests/ 에 __init__.py 가 없어 pytest 기본 import 모드(prepend)가
# 테스트 파일의 basedir 인 tests/ 를 자동으로 넣어 준다(`from golden_support import ...` 가 도는 이유).
pythonpath = .

# 오타 마커를 조용히 무시하지 않는다. --strict-config: 이 ini 에 알 수 없는 키가 있으면 경고가 아니라 에러.
addopts = --strict-markers --strict-config

# 손으로 단 xfail 도 strict — "고쳐졌는데 xfail 로 남아 아무도 모르는" 상태를 만들지 않는다.
xfail_strict = true
